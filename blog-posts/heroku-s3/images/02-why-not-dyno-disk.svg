<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">Why not save photos on the dyno disk?</text>

  <!-- LEFT: dyno disk -->
  <text x="300" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#dc2626">Before: photos on the dyno disk</text>
  <rect x="80" y="125" width="440" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Dyno disk, before restart</text>
  <rect x="125" y="190" width="160" height="50" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="205" y="223" text-anchor="middle" font-size="20" fill="#1f2937" font-family="Menlo, Consolas, monospace">cat.jpg</text>
  <rect x="315" y="190" width="160" height="50" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="395" y="223" text-anchor="middle" font-size="20" fill="#1f2937" font-family="Menlo, Consolas, monospace">dog.png</text>

  <line x1="300" y1="280" x2="300" y2="365" stroke="#6b7280" stroke-width="3" marker-end="url(#grey)"/>
  <text x="318" y="330" font-size="20" fill="#6b7280">restart or deploy</text>

  <rect x="80" y="375" width="440" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="415" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Dyno disk, after restart</text>
  <text x="300" y="460" text-anchor="middle" font-size="22" fill="#dc2626">Empty disk.</text>
  <text x="300" y="492" text-anchor="middle" font-size="22" font-weight="700" fill="#dc2626">The photos are gone.</text>

  <line x1="600" y1="90" x2="600" y2="540" stroke="#e5e7eb" stroke-width="2"/>

  <!-- RIGHT: S3 -->
  <text x="900" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#16a34a">After: photos in Amazon S3</text>
  <rect x="680" y="125" width="440" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="900" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">S3 bucket, before restart</text>
  <rect x="725" y="190" width="160" height="50" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="805" y="223" text-anchor="middle" font-size="20" fill="#1f2937" font-family="Menlo, Consolas, monospace">cat.jpg</text>
  <rect x="915" y="190" width="160" height="50" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="995" y="223" text-anchor="middle" font-size="20" fill="#1f2937" font-family="Menlo, Consolas, monospace">dog.png</text>

  <line x1="900" y1="280" x2="900" y2="365" stroke="#6b7280" stroke-width="3" marker-end="url(#grey)"/>
  <text x="918" y="330" font-size="20" fill="#6b7280">dyno restarts</text>

  <rect x="680" y="375" width="440" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="900" y="415" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">S3 bucket, after restart</text>
  <rect x="725" y="440" width="160" height="50" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="805" y="473" text-anchor="middle" font-size="20" fill="#1f2937" font-family="Menlo, Consolas, monospace">cat.jpg</text>
  <rect x="915" y="440" width="160" height="50" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="995" y="473" text-anchor="middle" font-size="20" fill="#1f2937" font-family="Menlo, Consolas, monospace">dog.png</text>

  <text x="600" y="585" text-anchor="middle" font-size="22" fill="#6b7280">Heroku restarts every dyno at least once a day.</text>
  <text x="600" y="617" text-anchor="middle" font-size="22" fill="#6b7280">Each restart or deploy starts with a fresh copy of your code and no saved files.</text>
</svg>
