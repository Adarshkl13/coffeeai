<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, Arial, sans-serif">
  <rect width="1200" height="630" fill="#f7f5ff"/>
  <text x="600" y="82" text-anchor="middle" font-size="44" font-weight="700" fill="#1f1a4d">Prompt Engineering: 10 Tips</text>
  <rect x="60" y="130" width="500" height="450" rx="32" fill="#ffffff" stroke="#c7c9f5" stroke-width="4"/>
  <text x="310" y="194" text-anchor="middle" font-size="36" font-weight="700" fill="#6366f1">Weak prompt</text>
  <rect x="100" y="230" width="420" height="100" rx="20" fill="#eef0ff"/>
  <text x="310" y="292" text-anchor="middle" font-size="30" fill="#1f1a4d">Write about exercise.</text>
  <text x="310" y="394" text-anchor="middle" font-size="28" fill="#6b6b8a">No role, no audience,</text>
  <text x="310" y="434" text-anchor="middle" font-size="28" fill="#6b6b8a">no format</text>
  <rect x="150" y="490" width="320" height="60" rx="30" fill="#eef0ff"/>
  <text x="310" y="530" text-anchor="middle" font-size="28" fill="#6366f1">Vague answer</text>
  <circle cx="600" cy="355" r="30" fill="#5b4bdb"/>
  <path d="M586 340 L604 355 L586 370" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="640" y="130" width="500" height="450" rx="32" fill="#ffffff" stroke="#5b4bdb" stroke-width="4"/>
  <text x="890" y="194" text-anchor="middle" font-size="36" font-weight="700" fill="#5b4bdb">Strong prompt</text>
  <text x="690" y="252" font-size="28" fill="#1f1a4d"><tspan font-weight="700">Role:</tspan> fitness coach</text>
  <text x="690" y="300" font-size="28" fill="#1f1a4d"><tspan font-weight="700">Audience:</tspan> office workers</text>
  <text x="690" y="348" font-size="28" fill="#1f1a4d"><tspan font-weight="700">Task:</tspan> 5 short tips</text>
  <text x="690" y="396" font-size="28" fill="#1f1a4d"><tspan font-weight="700">Format:</tspan> bullet list</text>
  <text x="690" y="444" font-size="28" fill="#1f1a4d"><tspan font-weight="700">Tone:</tspan> friendly</text>
  <rect x="710" y="490" width="360" height="60" rx="30" fill="#22c55e"/>
  <text x="890" y="530" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Clear, useful answer</text>
</svg>
