# Learner cards for the home page (home/_stories).
#
# stories:  REAL learners only, with their permission. The section is titled "Real stories from real learners".
# examples: illustrative people (not real reviews). Shown only while `stories` is empty, under the title
#           "Made for people like you", and every card carries an "Example" label.
# To turn an example into a real story: move it to `stories` once the person is real and has agreed.
#
# Each entry:
#   - name: Full name
#     role: Job title
#     course: Course title (as it appears in the app)
#     quote: 2 to 4 sentences
#     photo: stories/<file>.jpg   (optional; put the file in app/assets/images/stories/. Without it, initials show)
stories: []

examples:
