# PostgreSQL everywhere. Locally it uses your Mac's PostgreSQL (Homebrew); on Heroku it uses DATABASE_URL.
# Background jobs (Solid Queue) and the cache (Solid Cache) live in the same database.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: ai_academy_development

# Warning: the "test" database is erased and rebuilt when the tests run.
test:
  <<: *default
  database: ai_academy_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
